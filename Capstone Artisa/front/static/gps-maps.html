<!doctype html>
<!--
  Mapas de telemetria: los 4 mapas del cuaderno de telemetría del equipo (calor, rutas por camion,
  uso de rutas y puntos) calculados en el navegador para el rango de fechas que se elija.

  Datos que usa (mismo origen que el front, que hace de proxy a endpoints):
    GET /api/gps?desde=YYYY-MM-DD&hasta=YYYY-MM-DD   maximo 14 dias, ambos incluidos
        -> {desde, hasta, camiones: [asset_id...], conductores: [nombre o null...], cam: [indice en camiones...],
            t: [segundos desde 'desde' 00:00...], lat: [lat*1e5...], lon: [lon*1e5...]}
  El fondo, el selector de capas y las faenas vienen de /mapa-base.js, igual que en el resto de Artisa.
  Si la API queda en otro host, cambiar API_BASE.
-->
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mapas de telemetria</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
<link rel="stylesheet" href="/mapa-base.css?v=20261020-menu">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
<script src="https://unpkg.com/leaflet.heat@0.2.0/dist/leaflet-heat.js"></script>
<script src="/mapa-base.js?v=20261020-menu"></script>
<style>
  :root {
    --fondo: #f4f8f5;
    --panel: #ffffff;
    --texto: #1f2933;
    --suave: #616e7c;
    --borde: #d9dee4;
    --acento: #216447;
    --error: #c62828;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    display: flex; flex-direction: column;
    font: 14px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    color: var(--texto); background: var(--fondo);
  }
  .barra {
    display: flex; flex-wrap: wrap; align-items: end; gap: 12px 16px;
    padding: 12px 16px; background: var(--panel); border-bottom: 1px solid var(--borde);
  }
  .barra h1 { margin: 0 8px 0 0; font-size: 16px; align-self: center; }
  .campo { display: flex; flex-direction: column; gap: 4px; font-size: 12px; color: var(--suave); }
  .campo input {
    font: inherit; font-size: 14px; color: var(--texto); padding: 6px 8px;
    border: 1px solid var(--borde); border-radius: 6px; background: var(--panel);
  }
  button {
    font: inherit; cursor: pointer; padding: 7px 14px; border-radius: 6px;
    border: 1px solid var(--borde); background: var(--panel); color: var(--texto);
  }
  button:disabled { opacity: .5; cursor: default; }
  #cargar { background: var(--acento); border-color: var(--acento); color: #fff; }
  .duracion { display: flex; gap: 4px; }
  .duracion button[aria-pressed="true"] { border-color: var(--acento); color: var(--acento); font-weight: 600; }
  .selector-vista {
    display: flex; flex-direction: column; gap: 4px; min-width: 190px;
    color: var(--suave); font-size: 11px; font-weight: 700;
  }
  .selector-vista select {
    width: 100%; padding: 8px 34px 8px 11px; border: 1px solid var(--acento);
    border-radius: 8px; background-color: var(--panel); color: var(--acento);
    font: inherit; font-size: 14px; font-weight: 650; cursor: pointer;
  }
  .selector-vista select:focus {
    outline: 0; box-shadow: 0 0 0 3px rgba(33, 100, 71, .14);
  }
  #estado {
    margin: 0; padding: 8px 16px; min-height: 36px; white-space: pre-wrap;
    font-size: 12px; color: var(--suave); background: var(--panel); border-bottom: 1px solid var(--borde);
  }
  #estado.error { color: var(--error); }
  #mapa { flex: 1; min-height: 320px; }
  .leyenda {
    background: rgba(255, 255, 255, .92); padding: 8px 10px; border-radius: 6px;
    box-shadow: 0 1px 4px rgba(0, 0, 0, .25); font-size: 12px; max-width: 280px;
  }
  .leyenda .barra-color { display: flex; height: 10px; margin: 6px 0 2px; }
  .leyenda .barra-color span { flex: 1; }
  .leyenda .marcas { display: flex; justify-content: space-between; color: var(--suave); }
  .solo-calor .selector-vista { display: none; }
  .etiqueta { color: var(--acento); font-size: 11px; font-weight: 700; }
  .titulo { display: flex; flex-direction: column; gap: 2px; align-self: center; }
  .rango { display: flex; flex-wrap: wrap; align-items: end; gap: 8px 10px; margin: 0; padding: 0; border: 0; }
  .rango legend { float: left; width: 100%; margin-bottom: 2px; padding: 0; font-size: 11px; font-weight: 700; color: var(--suave); }
  .duracion button { padding: 7px 10px; font-size: 13px; }

  /* Selector de rutas por camión: conserva el control de capas de Leaflet,
     pero organiza las patentes para que una flota grande sea fácil de filtrar. */
  .leaflet-control-layers.control-camiones {
    border: 0; border-radius: 12px; background: var(--panel);
    box-shadow: 0 8px 24px rgba(23, 52, 42, .18); color: var(--texto);
  }
  .control-camiones.leaflet-control-layers-expanded {
    width: min(300px, calc(100vw - 72px)); padding: 0; overflow: hidden;
  }
  .control-camiones .leaflet-control-layers-base {
    margin: 0; padding: 10px 12px 8px; border-bottom: 1px solid var(--borde);
  }
  .control-camiones .leaflet-control-layers-base label,
  .control-camiones .leaflet-control-layers-overlays label {
    margin: 0; padding: 6px 7px; border-radius: 7px; line-height: 1.25;
  }
  .control-camiones .leaflet-control-layers-base label:hover,
  .control-camiones .leaflet-control-layers-overlays label:hover { background: #eef5f1; }
  .control-camiones .leaflet-control-layers-separator { display: none; }
  .control-camiones .leaflet-control-layers-overlays {
    max-height: 250px; margin: 0; padding: 5px 8px 8px; overflow-y: auto;
    scrollbar-width: thin; scrollbar-color: #8ea69b transparent;
  }
  .control-camiones .leaflet-control-layers-overlays::-webkit-scrollbar { width: 7px; }
  .control-camiones .leaflet-control-layers-overlays::-webkit-scrollbar-thumb {
    border-radius: 999px; background: #8ea69b;
  }
  .control-camiones .leaflet-control-layers-overlays label.capa-camion {
    border-bottom: 1px solid #edf1ee;
  }
  .control-camiones .leaflet-control-layers-overlays label.capa-general {
    margin-top: 5px; border-top: 1px solid var(--borde); border-radius: 0;
    color: var(--acento); font-weight: 600;
  }
  .filtro-camiones { padding: 11px 12px 8px; background: #f8fbf9; }
  .filtro-camiones__cabecera {
    display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px;
  }
  .filtro-camiones__cabecera strong { color: #173d30; font-size: 13px; }
  .filtro-camiones__contador {
    padding: 2px 7px; border-radius: 999px; background: #e4efe9;
    color: var(--acento); font-size: 11px; font-weight: 700;
  }
  .filtro-camiones__busqueda {
    display: flex; align-items: center; gap: 7px; padding: 7px 9px;
    border: 1px solid #cfdad4; border-radius: 8px; background: var(--panel);
  }
  .filtro-camiones__busqueda:focus-within {
    border-color: var(--acento); box-shadow: 0 0 0 2px rgba(33, 100, 71, .12);
  }
  .filtro-camiones__busqueda span { color: var(--suave); font-size: 15px; }
  .filtro-camiones__busqueda input {
    width: 100%; min-width: 0; padding: 0; border: 0; outline: 0;
    background: transparent; color: var(--texto); font: inherit;
  }
  .filtro-camiones__acciones { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-top: 7px; }
  .filtro-camiones__acciones button {
    padding: 5px 7px; border-color: #cfdad4; border-radius: 7px;
    background: var(--panel); color: var(--acento); font-size: 11px; font-weight: 650;
  }
  .filtro-camiones__acciones button:hover:not(:disabled) { background: #e9f2ed; }
  .filtro-camiones__vacio {
    display: none; margin: 0; padding: 13px 12px; color: var(--suave);
    text-align: center; font-size: 12px;
  }
  .filtro-camiones__vacio.visible { display: block; }
  .leaflet-popup.popup-uso-camiones .leaflet-popup-content-wrapper {
    width: min(520px, calc(100vw - 64px)) !important;
    max-width: calc(100vw - 64px); padding: 0; border-radius: 10px; overflow: hidden;
    box-shadow: 0 6px 20px rgba(23, 52, 42, .22); background: var(--panel);
  }
  .leaflet-popup.popup-uso-camiones .leaflet-popup-content {
    width: 100% !important; max-width: none !important; margin: 0;
  }
  .leaflet-popup.popup-uso-camiones .leaflet-popup-close-button {
    top: 4px; right: 4px; width: 25px; height: 25px; color: #49645a; font-size: 20px;
  }
  .leaflet-popup.popup-uso-camiones .leaflet-popup-tip { background: var(--panel); }
  .leaflet-popup.popup-uso-camiones a.leaflet-popup-close-button:hover { color: var(--acento); }
  .leaflet-tooltip.tooltip-uso-camiones {
    width: min(430px, calc(100vw - 64px)); max-width: calc(100vw - 64px);
    padding: 0; border: 0; border-radius: 10px; overflow: hidden;
    box-shadow: 0 6px 20px rgba(23, 52, 42, .22); background: var(--panel);
  }
  .leaflet-tooltip.tooltip-uso-camiones::before { display: none; }
  .uso-ruta-interactiva { cursor: pointer; }
  .tooltip-uso { width: 100%; }
  .tooltip-uso__titulo {
    display: block; padding: 9px 38px 9px 11px; background: #edf5f0;
    color: #173d30; font-size: 12px;
  }
  .tooltip-uso__lista {
    max-height: 190px; margin: 0; padding: 5px 7px; overflow-y: auto;
    overscroll-behavior: contain; list-style: none;
    scrollbar-width: thin; scrollbar-color: #8ea69b transparent;
  }
  .tooltip-uso__lista li {
    display: grid; grid-template-columns: 95px minmax(0, 1fr); align-items: center;
    gap: 10px; padding: 7px 5px;
    border-bottom: 1px solid #edf1ee;
  }
  .tooltip-uso__lista li:last-child { border-bottom: 0; }
  .tooltip-uso__lista strong { color: var(--texto); font-size: 12px; white-space: nowrap; }
  .tooltip-uso__lista span {
    color: var(--suave); font-size: 11px; line-height: 1.3;
    white-space: normal; overflow-wrap: break-word; word-break: normal;
  }
</style>
</head>
<body>
<header class="barra">
  <div class="titulo">
    <h1>Mapas de telemetría</h1>
  </div>
  <fieldset class="rango">
    <legend>Fechas (hasta 14 días)</legend>
    <label class="campo">Desde <input type="date" id="desde"></label>
    <label class="campo">Hasta <input type="date" id="hasta"></label>
    <div class="duracion" role="group" aria-label="Rangos rápidos">
      <button type="button" data-dias="1">1 día</button>
      <button type="button" data-dias="7">7 días</button>
      <button type="button" data-dias="14">14 días</button>
    </div>
    <button id="cargar">Cargar</button>
  </fieldset>
  <label class="selector-vista">
    TIPO DE MAPA
    <select id="selector-vista" aria-label="Elegir tipo de mapa">
      <option value="calor">Mapa de calor</option>
      <option value="rutas">Rutas por camión</option>
      <option value="uso">Uso de rutas</option>
      <option value="puntos">Puntos GPS</option>
    </select>
  </label>
</header>
<p id="estado">Elige las fechas y el tipo de mapa, y presiona Cargar.</p>
<div id="mapa"></div>

<script>
"use strict";

const API_BASE = "";
const MAX_DIAS = 14;  // mismo máximo que /api/gps (GPS_MAX_DIAS)
document.body.classList.toggle("solo-calor", new URLSearchParams(location.search).get("vista") === "calor");

// ---------------------------------------------------------------------------
// Utilidades
// ---------------------------------------------------------------------------
const nf = new Intl.NumberFormat("es-CL");
const DIAS = ["Lunes", "Martes", "Miércoles", "Jueves", "Viernes", "Sábado", "Domingo"];
const pausa = () => new Promise(r => setTimeout(r, 0));
const dos = v => (v < 10 ? "0" : "") + v;
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"}[c]));

// Redondeo como numpy/pandas: los .5 exactos van al par (Math.round los sube siempre)
function redondeoPar(v) {
  const r = Math.round(v);
  return (r - v === 0.5 && r % 2 !== 0) ? r - 1 : r;
}

function estado(texto, error = false) {
  const el = document.getElementById("estado");
  el.textContent = texto;
  el.classList.toggle("error", error);
}

async function pedir(ruta) {
  const token = localStorage.getItem("artisa_token");
  if (!token) throw new Error("Inicia sesión en Artisa para consultar los datos.");
  const r = await fetch(API_BASE + ruta, {
    headers: {Authorization: `Bearer ${token}`}, cache: "no-store"
  });
  if (r.status === 401) throw new Error("Tu sesión expiró. Vuelve a iniciar sesión en Artisa.");
  let cuerpo = null;
  try { cuerpo = await r.json(); } catch (e) { /* respuesta sin JSON */ }
  if (!r.ok) throw new Error((cuerpo && cuerpo.error) || `Error ${r.status} en ${ruta}`);
  return cuerpo;
}

// ---------------------------------------------------------------------------
// Mapa: el mismo fondo, selector de capas y faenas que el resto de Artisa (mapa-base.js)
// ---------------------------------------------------------------------------
const base = ArtisaMapaBase.crear(document.getElementById("mapa"), {pedir: ruta => pedir(ruta), zoom: 6});
const mapa = base.mapa;
L.control.scale().addTo(mapa);
window.addEventListener("message", event => {
  if (event.origin === location.origin && event.data === "artisa:show-map") mapa.invalidateSize();
});

// ---------------------------------------------------------------------------
// Datos GPS
// ---------------------------------------------------------------------------
let datos = null;          // puntos del rango cargado
let cache = {};            // vista -> promesa de {overlays, leyenda, resumen, encuadre}

// "06-10-2026" o "01-10-2026 al 06-10-2026"
const fechaCL = iso => iso.split("-").reverse().join("-");
const periodo = D => D.desde === D.hasta ? fechaCL(D.desde) : `${fechaCL(D.desde)} al ${fechaCL(D.hasta)}`;
let vistaActual = "calor";
let mostrado = null;       // lo que esta dibujado ahora en el mapa
let turno = 0;             // invalida calculos viejos si se cambia de vista o de fechas

function prepararDatos(r) {
  const n = r.t.length;
  const [y, m, d] = r.desde.split("-").map(Number);
  const D = {desde: r.desde, hasta: r.hasta, inicioMs: Date.UTC(y, m - 1, d),
             camiones: r.camiones, conductores: r.conductores || [], filas: n};
  // gps_validos: fuera de rango y el 0,0 (GPS sin fix) no cuentan
  const validos = [];
  for (let i = 0; i < n; i++) {
    const la = r.lat[i], lo = r.lon[i];
    if (la >= -9e6 && la <= 9e6 && lo >= -18e6 && lo <= 18e6 && !(la === 0 && lo === 0)) validos.push(i);
  }
  const k = validos.length;
  D.n = k;
  D.cam = new Int32Array(k); D.t = new Float64Array(k);
  D.latE = new Int32Array(k); D.lonE = new Int32Array(k);   // coordenadas x 1e5 (5 decimales = ~1 m)
  D.lat = new Float64Array(k); D.lon = new Float64Array(k);
  validos.forEach((i, j) => {
    D.cam[j] = r.cam[i]; D.t[j] = r.t[i];
    D.latE[j] = r.lat[i]; D.lonE[j] = r.lon[i];
    D.lat[j] = r.lat[i] / 1e5; D.lon[j] = r.lon[i] / 1e5;
  });
  // Copias exactas de la ETL (mismo camion y misma hora): vienen ordenados por camion y hora
  const unicos = [];
  for (let j = 0; j < k; j++) {
    if (j > 0 && D.cam[j] === D.cam[j - 1] && D.t[j] === D.t[j - 1]) continue;
    unicos.push(j);
  }
  D.unicos = Int32Array.from(unicos);
  D.nPatentes = new Set(r.cam).size;
  return D;
}

function fecha(D, t) { return new Date(D.inicioMs + t * 1000); }
function ddmmHHMM(D, t) {
  const f = fecha(D, t);
  return `${dos(f.getUTCDate())}-${dos(f.getUTCMonth() + 1)} ${dos(f.getUTCHours())}:${dos(f.getUTCMinutes())}`;
}
function limitesDatos(lats, lons) {
  let a = Infinity, b = Infinity, c = -Infinity, e = -Infinity;
  for (let i = 0; i < lats.length; i++) {
    if (lats[i] < a) a = lats[i]; if (lats[i] > c) c = lats[i];
    if (lons[i] < b) b = lons[i]; if (lons[i] > e) e = lons[i];
  }
  return lats.length ? [[a, b], [c, e]] : null;
}

// ---------------------------------------------------------------------------
// Leyendas
// ---------------------------------------------------------------------------
function leyenda(html) {
  const c = L.control({position: "bottomright"});
  c.onAdd = () => { const div = L.DomUtil.create("div", "leyenda"); div.innerHTML = html; return div; };
  return c;
}
function leyendaContinua(colores, vmin, vmax, titulo, marca = v => nf.format(v)) {
  return leyenda(`${esc(titulo)}<div class="barra-color" style="background:linear-gradient(to right,${colores.join(",")})"></div>`
    + `<div class="marcas"><span>${esc(marca(vmin))}</span><span>${esc(marca(vmax))}</span></div>`);
}
function leyendaPasos(colores, cortes, titulo) {
  return leyenda(`${esc(titulo)}<div class="barra-color">${colores.map(c => `<span style="background:${c}"></span>`).join("")}</div>`
    + `<div class="marcas">${cortes.map(c => `<span>${nf.format(c)}</span>`).join("")}</div>`);
}
function escalaLineal(colores, vmin, vmax) {
  return v => {
    const x = Math.min(Math.max((v - vmin) / (vmax - vmin), 0), 1) * (colores.length - 1);
    const i = Math.min(Math.floor(x), colores.length - 2), f = x - i;
    const a = colores[i].match(/\w\w/g).map(h => parseInt(h, 16));
    const b = colores[i + 1].match(/\w\w/g).map(h => parseInt(h, 16));
    return "#" + a.map((c, k) => Math.round(c + (b[k] - c) * f).toString(16).padStart(2, "0")).join("");
  };
}

// ---------------------------------------------------------------------------
// 1) Mapa de calor: cada reporte suma en su celda de ~100 m (peso logaritmico)
// ---------------------------------------------------------------------------
function vistaCalor(D) {
  const celdas = new Map();
  for (let i = 0; i < D.n; i++) {
    const clave = (redondeoPar(D.lat[i] * 1000) + 90000) * 400000 + (redondeoPar(D.lon[i] * 1000) + 180000);
    celdas.set(clave, (celdas.get(clave) || 0) + 1);
  }
  let max = 0;
  for (const v of celdas.values()) if (v > max) max = v;
  const puntos = [];
  for (const [clave, v] of celdas) {
    const la = Math.floor(clave / 400000) - 90000, lo = clave % 400000 - 180000;
    puntos.push([la / 1000, lo / 1000, Math.log1p(v) / Math.log1p(max)]);
  }
  const calor = L.heatLayer(puntos, {radius: 8, blur: 10, minOpacity: 0.3, max: 1, maxZoom: 18});
  const encuadre = {limites: limitesDatos(D.lat, D.lon), opciones: {padding: [40, 40], maxZoom: 12}};
  return {
    overlays: {"Densidad GPS del período": calor},
    resumen: `${periodo(D)}: ${nf.format(D.n)} reportes GPS de ${D.nPatentes} camiones.`,
    encuadre,
  };
}

// ---------------------------------------------------------------------------
// 2) Rutas por camion: una pausa mayor a GAP_MINUTOS corta la ruta en un nuevo viaje
// ---------------------------------------------------------------------------
const GAP_MINUTOS = 30;
const PALETA = ["#e6194b", "#3cb44b", "#4363d8", "#f58231", "#911eb4", "#008080", "#9a6324",
                "#800000", "#808000", "#000075", "#f032e6", "#469990", "#c49a00", "#005f73", "#ae2012"];

function vistaRutas(D) {
  // Tramo [inicio, fin) de cada camion (los puntos vienen ordenados por camion y hora)
  const tramos = new Map();
  for (let i = 0; i < D.n; i++) {
    const r = tramos.get(D.cam[i]);
    if (r) r[1] = i + 1; else tramos.set(D.cam[i], [i, i + 1]);
  }
  const camiones = [...tramos.entries()].sort((a, b) => (b[1][1] - b[1][0]) - (a[1][1] - a[1][0]));
  const overlays = {};
  let dibujados = 0;
  camiones.forEach(([c, [ini, fin]], k) => {
    const color = PALETA[k % PALETA.length];
    const grupo = L.featureGroup();
    const viajes = [];
    let actual = [];
    for (let i = ini; i < fin; i++) {
      if (i > ini && D.t[i] - D.t[i - 1] > GAP_MINUTOS * 60) { viajes.push(actual); actual = []; }
      actual.push([D.latE[i] / 1e5, D.lonE[i] / 1e5]);
    }
    viajes.push(actual);
    const nombre = esc(D.camiones[c]);
    const info = `Camión ${nombre} · ${viajes.length} viajes<br>${ddmmHHMM(D, D.t[ini])} → ${ddmmHHMM(D, D.t[fin - 1])}`;
    const lineas = viajes.filter(v => v.length >= 2);
    if (lineas.length) L.polyline(lineas, {color, weight: 3, opacity: 0.8}).bindTooltip(info, {sticky: true}).addTo(grupo);
    for (const v of viajes) {
      if (v.length === 1) {  // viaje de un solo reporte: sin circulo no se veria en el mapa
        L.circleMarker(v[0], {radius: 3, color, fill: true, fillOpacity: 1}).bindTooltip(info).addTo(grupo);
      }
      dibujados += v.length;
    }
    overlays[`Camión ${nombre}`] = grupo;
  });
  return {
    overlays,
    resumen: `${periodo(D)}: recorridos de ${camiones.length} camiones (${nf.format(dibujados)} reportes dibujados).`,
    encuadre: {limites: limitesDatos(D.lat, D.lon), opciones: {padding: [30, 30]}},
  };
}

// ---------------------------------------------------------------------------
// 3) Uso de rutas: cada linea tiene un "radio invisible" y cuenta cuantos camiones distintos
//    van por su lado (paralelos, en direccion parecida). Mismo calculo que la celda del Colab.
// ---------------------------------------------------------------------------
const USO = {
  MAX_GAP_MIN: 5,       // si el camion dejo de reportar mas de estos minutos, no se une
  VEL_MAX_KMH: 150,     // saltos de GPS mas rapidos que esto no se unen
  RADIO_BASE_M: 60,     // radio minimo alrededor de cada linea
  RADIO_FACTOR: 0.15,   // el radio crece con el largo: linea de 2 km -> radio 360 m
  RADIO_MAX_M: 800,     // tope del radio
  PUNTOS_LINEA: 9,      // puntos de control a lo largo de cada linea
  FRACCION_MIN: 0.6,    // otro camion cuenta si esta cerca en al menos el 60% de la linea...
  ANG_MAX: 30,          // ...y va en direccion parecida (grados)
  PASO_M: 50,           // resolucion de la nube de referencia (m)
  N_RADIOS: 8,          // el radio de cada linea se redondea a uno de estos tamanos
  CELDAS_RADIO: 3,      // el radio se cubre con esta cantidad de celdas
  ANG_PASO: 15,         // las direcciones se agrupan en bloques de estos grados
  LOTE: 5000,           // lineas entre cada actualizacion de progreso
};
const COLORES = ["#dc2626", "#f97316", "#14532d"];  // mismos colores que las rutas clasificadas

// Tabla hash clave -> mascara de camiones (un bit por camion, en palabras de 32 bits).
// Las claves son enteros grandes (> 2^31): un Map de JS con esas claves es varias veces mas lento.
class TablaMascaras {
  constructor(W) { this.W = W; this.reservar(16); }
  reservar(bits) {
    this.cap = 1 << bits; this.mascara = this.cap - 1; this.n = 0;
    this.claves = new Float64Array(this.cap).fill(-1);
    this.m = new Uint32Array(this.cap * this.W);
  }
  inicio(clave) {
    let h = Math.imul(clave >>> 0, 0x9e3779b1) ^ Math.imul((clave / 4294967296) | 0, 0x85ebca6b);
    h ^= h >>> 15; h = Math.imul(h, 0x2c1b3c6d); h ^= h >>> 12;
    return h & this.mascara;
  }
  // Posicion de la clave, o -1 si no esta
  buscar(clave) {
    const claves = this.claves;
    for (let i = this.inicio(clave); ; i = (i + 1) & this.mascara) {
      if (claves[i] === clave) return i;
      if (claves[i] === -1) return -1;
    }
  }
  // Posicion de la clave; la agrega si no esta
  slot(clave) {
    if (2 * (this.n + 1) > this.cap) this.crecer();
    const claves = this.claves;
    for (let i = this.inicio(clave); ; i = (i + 1) & this.mascara) {
      if (claves[i] === clave) return i;
      if (claves[i] === -1) { claves[i] = clave; this.n++; return i; }
    }
  }
  crecer() {
    const claves = this.claves, m = this.m, W = this.W;
    this.reservar(Math.log2(this.cap) + 1);
    for (let i = 0; i < claves.length; i++) {
      if (claves[i] === -1) continue;
      const s = this.slot(claves[i]);
      for (let w = 0; w < W; w++) this.m[s * W + w] = m[i * W + w];
    }
  }
}

// Los dos ciclos pesados van en funciones normales (no async): asi el navegador los optimiza bien.

// Tabla de un tamano de radio: celda+direccion -> camiones que pasan por ahi, con las
// direcciones parecidas ya sumadas. La nube son todas las lineas muestreadas cada PASO_M.
function tablaNivel(g, celda, ny) {
  const {n, W, R, N_ANG, dAng, x0, y0, dx, dy, pasos, camion, angBin, xMin, yMin} = g;
  const base = new TablaMascaras(W);
  for (let l = 0; l < n; l++) {
    const w = camion[l] >>> 5, bit = 1 << (camion[l] & 31), a = angBin[l], p = pasos[l];
    let anterior = -1;
    for (let s = 0; s <= p; s++) {
      const t = s / p;
      const c = ((Math.floor((x0[l] + dx[l] * t - xMin) / celda) + R + 1) * ny
                 + (Math.floor((y0[l] + dy[l] * t - yMin) / celda) + R + 1)) * N_ANG + a;
      if (c === anterior) continue;  // puntos seguidos de la misma linea en la misma celda
      anterior = c;
      const i = base.slot(c);
      base.m[i * W + w] |= bit;
    }
  }
  const tabla = new TablaMascaras(W);
  for (let s = 0; s < base.cap; s++) {
    const c = base.claves[s];
    if (c === -1) continue;
    const a = c % N_ANG, sinAng = c - a;
    for (let k = 0; k < dAng.length; k++) {
      const s2 = tabla.slot(sinAng + (a + dAng[k] + N_ANG) % N_ANG);
      for (let w = 0; w < W; w++) tabla.m[s2 * W + w] |= base.m[s * W + w];
    }
  }
  return tabla;
}

// Puntos de control de cada linea: camiones en las celdas vecinas (radio de la linea).
// Un camion cuenta si esta cerca en al menos minPuntos de los puntos de control.
function contarCamionesCerca(g, tabla, celda, ny, lineas, ini, fin, camionesCerca, camionesPorLinea) {
  const {nCam, W, R, N_ANG, discoX, discoY, x0, y0, dx, dy, angBin, xMin, yMin, tk, minPuntos} = g;
  const cnt = new Uint8Array(nCam), tmp = new Uint32Array(W), tocados = new Int32Array(nCam), m = tabla.m;
  for (let q = ini; q < fin; q++) {
    const l = lineas[q], a = angBin[l];
    let nTocados = 0;
    for (let p = 0; p < tk.length; p++) {
      const qx = Math.floor((x0[l] + dx[l] * tk[p] - xMin) / celda) + R + 1;
      const qy = Math.floor((y0[l] + dy[l] * tk[p] - yMin) / celda) + R + 1;
      tmp.fill(0);
      for (let e = 0; e < discoX.length; e++) {
        const s = tabla.buscar(((qx + discoX[e]) * ny + qy + discoY[e]) * N_ANG + a);
        if (s !== -1) for (let w = 0; w < W; w++) tmp[w] |= m[s * W + w];
      }
      for (let w = 0; w < W; w++) {
        let v = tmp[w];
        while (v) {
          const bajo = v & -v, c = w * 32 + 31 - Math.clz32(bajo);
          if (cnt[c] === 0) tocados[nTocados++] = c;
          cnt[c]++;
          v = (v ^ bajo) >>> 0;
        }
      }
    }
    const cerca = [];
    for (let j = 0; j < nTocados; j++) {
      const c = tocados[j];
      if (cnt[c] >= minPuntos) cerca.push(c);
      cnt[c] = 0;
    }
    if (!cerca.length) cerca.push(camion[l]);
    camionesPorLinea[l] = cerca;
    camionesCerca[l] = cerca.length;
  }
}

async function vistaUso(D, progreso) {
  const P = USO, u = D.unicos;
  // Se une cada reporte con el anterior del mismo camion, salvo pausas largas o saltos imposibles
  const I0 = [], I1 = [], pares = [];
  for (let j = 1; j < u.length; j++) {
    const i = u[j], p = u[j - 1];
    if (D.cam[i] !== D.cam[p]) continue;
    const dtH = (D.t[i] - D.t[p]) / 3600;
    const distM = Math.hypot(D.lat[i] - D.lat[p], (D.lon[i] - D.lon[p]) * Math.cos(D.lat[i] * Math.PI / 180)) * 111000;
    if (distM > 0) pares.push(distM);
    if (dtH > 0 && dtH <= P.MAX_GAP_MIN / 60 && distM > 0 && distM / 1000 <= P.VEL_MAX_KMH * dtH) { I0.push(p); I1.push(i); }
  }
  const n = I0.length;
  const resumen = [
    `${periodo(D)}: ${nf.format(u.length)} reportes GPS de ${new Set(Array.from(u, i => D.cam[i])).size} camiones.`,
    `Tramos dibujados: ${nf.format(n)} · sin dibujar ${nf.format(pares.length - n)} (más de ${P.MAX_GAP_MIN} min sin reportes o salto de GPS).`,
  ];
  if (!n) return {overlays: {}, resumen: resumen.join("\n")};

  // Camion de cada linea, numerado desde 0
  const numero = new Map(), camion = new Int32Array(n);
  for (let l = 0; l < n; l++) {
    const c = D.cam[I1[l]];
    if (!numero.has(c)) numero.set(c, numero.size);
    camion[l] = numero.get(c);
  }
  const nCam = numero.size, W = Math.ceil(nCam / 32);
  const indiceCamion = Array.from(numero.keys());  // índice compacto -> índice de D.camiones

  // Pasar a metros (plano local) para medir distancias y angulos reales
  let suma = 0;
  for (let l = 0; l < n; l++) suma += D.lat[I0[l]] + D.lat[I1[l]];
  const latRef = (suma / (2 * n)) * Math.PI / 180, kx = 111000 * Math.cos(latRef), ky = 111000;
  const x0 = new Float64Array(n), y0 = new Float64Array(n), dx = new Float64Array(n), dy = new Float64Array(n);
  const radio = new Float64Array(n), angBin = new Int32Array(n), pasos = new Int32Array(n), nivel = new Uint8Array(n);
  const N_ANG = Math.floor(180 / P.ANG_PASO);
  const radios = Array.from({length: P.N_RADIOS}, (_, k) => P.RADIO_BASE_M * Math.pow(P.RADIO_MAX_M / P.RADIO_BASE_M, k / (P.N_RADIOS - 1)));
  let xMin = Infinity, yMin = Infinity, yMax = -Infinity;
  for (let l = 0; l < n; l++) {
    const a = I0[l], b = I1[l];
    x0[l] = D.lon[a] * kx; y0[l] = D.lat[a] * ky;
    const x1 = D.lon[b] * kx, y1 = D.lat[b] * ky;
    dx[l] = x1 - x0[l]; dy[l] = y1 - y0[l];
    const largo = Math.hypot(dx[l], dy[l]);
    const ang = ((Math.atan2(dy[l], dx[l]) * 180 / Math.PI) % 180 + 180) % 180;  // ida = vuelta
    radio[l] = Math.min(P.RADIO_BASE_M + P.RADIO_FACTOR * largo, P.RADIO_MAX_M);
    angBin[l] = Math.floor(ang / P.ANG_PASO) % N_ANG;
    pasos[l] = Math.max(1, Math.ceil(largo / P.PASO_M));
    let mejor = 0;
    for (let k = 1; k < radios.length; k++) {
      if (Math.abs(Math.log(radio[l]) - Math.log(radios[k])) < Math.abs(Math.log(radio[l]) - Math.log(radios[mejor]))) mejor = k;
    }
    nivel[l] = mejor;
    xMin = Math.min(xMin, x0[l], x1); yMin = Math.min(yMin, y0[l], y1); yMax = Math.max(yMax, y0[l], y1);
  }

  const dAng = [];
  for (let d = -Math.floor(N_ANG / 2); d <= Math.floor(N_ANG / 2); d++) if (Math.abs(d) * P.ANG_PASO <= P.ANG_MAX) dAng.push(d);
  const R = P.CELDAS_RADIO, discoX = [], discoY = [];
  for (let i = -R; i <= R; i++) for (let j = -R; j <= R; j++) if (i * i + j * j <= R * R) { discoX.push(i); discoY.push(j); }
  const g = {n, nCam, W, R, N_ANG, dAng, discoX, discoY, x0, y0, dx, dy, pasos, camion, angBin, xMin, yMin,
             tk: Array.from({length: P.PUNTOS_LINEA}, (_, k) => (k + 0.5) / P.PUNTOS_LINEA),
             minPuntos: Math.ceil(P.FRACCION_MIN * P.PUNTOS_LINEA)};
  const camionesCerca = new Int32Array(n).fill(1);
  const camionesPorLinea = new Array(n);

  for (let k = 0; k < radios.length; k++) {
    const lineasK = [];
    for (let l = 0; l < n; l++) if (nivel[l] === k) lineasK.push(l);
    if (!lineasK.length) continue;
    progreso(`Calculando uso de rutas… radio ${k + 1} de ${radios.length}`);
    await pausa();
    const celda = radios[k] / R;
    const ny = Math.floor((yMax - yMin) / celda) + 2 * R + 3;
    const tabla = tablaNivel(g, celda, ny);
    for (let ini = 0; ini < lineasK.length; ini += P.LOTE) {
      progreso(`Calculando uso de rutas… radio ${k + 1} de ${radios.length} (${nf.format(ini)} de ${nf.format(lineasK.length)} lineas)`);
      await pausa();
      contarCamionesCerca(g, tabla, celda, ny, lineasK, ini, Math.min(ini + P.LOTE, lineasK.length),
                          camionesCerca, camionesPorLinea);
    }
  }

  // Líneas únicas agrupadas por el conjunto de camiones cercanos. Así cada tooltip puede
  // mostrar las patentes correctas sin cambiar el cálculo ni la geometría de los tramos.
  const vistas = new Set(), grupos = new Map();
  let maxCamiones = 1;
  const lats = [], lons = [];
  for (let l = 0; l < n; l++) {
    const a = I0[l], b = I1[l], cercanos = camionesPorLinea[l] || [camion[l]], c = cercanos.length;
    const firma = cercanos.join(",");
    const id = `${D.latE[a]},${D.lonE[a]},${D.latE[b]},${D.lonE[b]},${firma}`;
    if (vistas.has(id)) continue;
    vistas.add(id);
    if (!grupos.has(firma)) grupos.set(firma, {camiones: cercanos, lineas: []});
    grupos.get(firma).lineas.push([[D.latE[a] / 1e5, D.lonE[a] / 1e5], [D.latE[b] / 1e5, D.lonE[b] / 1e5]]);
    lats.push(D.lat[a], D.lat[b]); lons.push(D.lon[a], D.lon[b]);
    if (c > maxCamiones) maxCamiones = c;
  }
  const vmax = Math.max(maxCamiones, 2), escala = escalaLineal(COLORES, 1, vmax);
  const capa = L.featureGroup();
  // El mapa general usa Canvas por rendimiento. La interacción se fuerza a SVG porque sus
  // trazos reciben de manera fiable los eventos del cursor incluso cuando varias rutas coinciden.
  const renderInteraccion = L.svg({padding: 0.5});
  const gruposOrdenados = [...grupos.values()].sort((a, b) => a.camiones.length - b.camiones.length);
  for (const grupo of gruposOrdenados) {
    const c = grupo.camiones.length;
    const filas = grupo.camiones.map(compacto => {
      const indice = indiceCamion[compacto];
      const patente = esc(D.camiones[indice] || "Patente no informada");
      const conductor = esc(D.conductores[indice] || "Conductor no informado");
      return `<li><strong>${patente}</strong><span>${conductor}</span></li>`;
    }).join("");
    const pct = c / nCam * 100;
    const titulo = (c === 1 ? "1 camión pasó por aquí" : `${c} camiones distintos pasaron por aquí`)
      + ` · ${nf.format(Math.round(pct * 10) / 10)} % de los ${nCam} camiones del período`;
    const detalle = `<div class="tooltip-uso"><strong class="tooltip-uso__titulo">${titulo}</strong>`
      + `<ul class="tooltip-uso__lista">${filas}</ul></div>`;
    const grosor = 2 + 4 * c / maxCamiones;
    L.polyline(grupo.lineas, {color: escala(c), weight: grosor, opacity: 0.9, interactive: false})
      .addTo(capa);

    // La línea visible sigue siendo fina, pero una segunda línea transparente crea un área
    // cómoda para el cursor. Esto evita tener que apuntar con precisión a un trazo de 2–6 px.
    const zonaInteractiva = L.polyline(grupo.lineas, {
      color: "#173d30", weight: Math.max(16, grosor + 10), opacity: 0.001,
      className: "uso-ruta-interactiva", bubblingMouseEvents: false, renderer: renderInteraccion,
    }).bindTooltip(detalle, {
      className: "tooltip-uso-camiones", sticky: true, direction: "top", opacity: 1,
    }).bindPopup(detalle, {
      className: "popup-uso-camiones", minWidth: 520, maxWidth: 520,
      autoPan: true, autoPanPadding: [24, 24],
    }).addTo(capa);

    // Leaflet abre el tooltip al pasar el cursor y el popup completo al hacer clic.
    zonaInteractiva.on("tooltipopen", evento => L.DomEvent.disableScrollPropagation(evento.tooltip.getElement()));
    zonaInteractiva.on("popupopen", evento => L.DomEvent.disableScrollPropagation(evento.popup.getElement()));
  }
  return {
    overlays: {"Uso de rutas": capa},
    // Escala en % de la flota del período: el cálculo sigue contando camiones distintos.
    leyenda: leyendaContinua(COLORES, 1, vmax,
      `% de los ${nCam} camiones del período que pasó cerca del tramo (rojo = pocos, verde = muchos)`,
      v => nf.format(Math.round(v / nCam * 1000) / 10) + " %"),
    resumen: resumen.join("\n"),
    encuadre: {limites: limitesDatos(lats, lons), opciones: {padding: [30, 30]}},
  };
}

// ---------------------------------------------------------------------------
// 4) Puntos: cada reporte como un punto en un solo canvas. Color = reportes alrededor.
//    Al pasar el mouse muestra que camiones reportaron ahi (dia y hora).
// ---------------------------------------------------------------------------
const RADIO_PUNTO = 4;            // tamano del punto en pixeles
const CELDA_M = 50;               // resolucion para medir la concentracion de puntos (m)
const RADIO_CELDAS = 1;           // se suman los puntos de las celdas vecinas hasta este radio
const MAX_CAMIONES_CARTEL = 10;   // camiones listados en el cartel; el resto se resume como "y N mas"

const CapaPuntos = L.Layer.extend({
  initialize(d) { this.d = d; },

  onAdd(m) {
    const d = this.d, n = d.lat.length, radio = RADIO_PUNTO;
    // Coordenadas del mundo a zoom 0 (se calculan una vez; a otro zoom solo se escalan)
    const wx = new Float64Array(n), wy = new Float64Array(n);
    for (let i = 0; i < n; i++) { const p = m.project([d.lat[i], d.lon[i]], 0); wx[i] = p.x; wy[i] = p.y; }
    const canvas = this.canvas = L.DomUtil.create("canvas", "leaflet-zoom-hide");
    canvas.style.pointerEvents = "none";
    m.getPanes().overlayPane.appendChild(canvas);
    // Celda de pantalla -> TODOS los puntos que caen en ella (tambien los encimados)
    const celdas = new Map(), CELDA = 8, px = new Float32Array(n), py = new Float32Array(n);

    const dibujar = () => {
      const tam = m.getSize(), escala = Math.pow(2, m.getZoom()), orig = m.getPixelBounds().min;
      canvas.width = tam.x; canvas.height = tam.y;
      L.DomUtil.setPosition(canvas, m.containerPointToLayerPoint([0, 0]));
      const ctx = canvas.getContext("2d");
      ctx.globalAlpha = 0.8;
      celdas.clear();
      const caminos = d.colores.map(() => new Path2D());
      for (let i = 0; i < n; i++) {
        const x = wx[i] * escala - orig.x, y = wy[i] * escala - orig.y;
        if (x < -radio || y < -radio || x > tam.x + radio || y > tam.y + radio) continue;
        px[i] = x; py[i] = y;
        caminos[d.niv[i]].moveTo(x + radio, y);
        caminos[d.niv[i]].arc(x, y, radio, 0, 2 * Math.PI);
        const k = Math.floor(x / CELDA) * 100000 + Math.floor(y / CELDA), lista = celdas.get(k);
        if (lista) lista.push(i); else celdas.set(k, [i]);
      }
      // De menos a mas concentrado, para que lo rojo quede encima
      caminos.forEach((c, k) => { ctx.fillStyle = d.colores[k]; ctx.fill(c); });
    };

    const cuando = i => {
      const s = d.seg[i];
      return `${d.dias[d.dia[i]]} ${dos(Math.floor(s / 3600))}:${dos(Math.floor(s / 60) % 60)}:${dos(s % 60)}`;
    };
    const momento = i => d.dia[i] * 86400 + d.seg[i];

    // Un solo cartel que sigue al mouse y se quita apenas el mouse sale de los puntos
    const cartel = this.cartel = L.tooltip({direction: "top", offset: [0, -radio - 2], opacity: 0.95});
    const cerrar = this.cerrar = () => { if (m.hasLayer(cartel)) m.removeLayer(cartel); };

    const mover = e => {
      const cx = Math.floor(e.containerPoint.x / CELDA), cy = Math.floor(e.containerPoint.y / CELDA);
      const alcance = (radio + 2) * (radio + 2), porCamion = new Map();
      let total = 0;
      for (let a = -1; a <= 1; a++) for (let b = -1; b <= 1; b++) {
        const lista = celdas.get((cx + a) * 100000 + cy + b);
        if (!lista) continue;
        for (const i of lista) {
          const ddx = px[i] - e.containerPoint.x, ddy = py[i] - e.containerPoint.y;
          if (ddx * ddx + ddy * ddy > alcance) continue;
          let r = porCamion.get(d.cam[i]);
          if (!r) porCamion.set(d.cam[i], r = {n: 0, primero: i, ultimo: i});
          r.n++; total++;
          if (momento(i) < momento(r.primero)) r.primero = i;
          if (momento(i) > momento(r.ultimo)) r.ultimo = i;
        }
      }
      if (total === 0) { cerrar(); return; }
      // Todos los camiones bajo el mouse, el que mas reporto ahi primero
      const filas = [...porCamion.entries()].sort((x, y) => y[1].n - x[1].n);
      let html = `<b>${total} ${total === 1 ? "reporte" : "reportes"} de ${filas.length} ${filas.length === 1 ? "camión" : "camiones"}</b>`;
      for (const [c, r] of filas.slice(0, MAX_CAMIONES_CARTEL)) {
        html += `<br><b>${esc(d.camiones[c])}:</b> ` + (r.n === 1 ? cuando(r.primero)
          : `${r.n} reportes, ${cuando(r.primero)} → ${cuando(r.ultimo)}`);
      }
      if (filas.length > MAX_CAMIONES_CARTEL) html += `<br>… y ${filas.length - MAX_CAMIONES_CARTEL} camiones más`;
      cartel.setLatLng(e.latlng).setContent(html);
      if (!m.hasLayer(cartel)) cartel.addTo(m);
    };

    this.eventos = {mousemove: mover, mouseout: cerrar, movestart: cerrar, zoomstart: cerrar,
                    moveend: dibujar, resize: dibujar};
    m.on(this.eventos);
    dibujar();
  },

  onRemove(m) {
    m.off(this.eventos);
    this.cerrar();
    this.canvas.remove();
  },
});

function vistaPuntos(D) {
  const u = D.unicos, n = u.length;
  // Concentracion de cada punto: reportes en su celda de ~CELDA_M m y las vecinas
  const CELDA = CELDA_M / 111000;
  const clave = (i, j) => (i + 300000) * 1000000 + (j + 500000);
  const ci = new Int32Array(n), cj = new Int32Array(n), porCelda = new Map();
  for (let q = 0; q < n; q++) {
    ci[q] = Math.floor(D.lat[u[q]] / CELDA); cj[q] = Math.floor(D.lon[u[q]] / CELDA);
    const k = clave(ci[q], cj[q]);
    porCelda.set(k, (porCelda.get(k) || 0) + 1);
  }
  const alrededor = new Map();
  for (const [k, v] of porCelda) {
    const i = Math.floor(k / 1000000) - 300000, j = k % 1000000 - 500000;
    for (let di = -RADIO_CELDAS; di <= RADIO_CELDAS; di++) for (let dj = -RADIO_CELDAS; dj <= RADIO_CELDAS; dj++) {
      const k2 = clave(i + di, j + dj);
      alrededor.set(k2, (alrededor.get(k2) || 0) + v);
    }
  }
  const concentracion = new Int32Array(n);
  let maxConc = 0;
  for (let q = 0; q < n; q++) {
    concentracion[q] = alrededor.get(clave(ci[q], cj[q]));
    if (concentracion[q] > maxConc) maxConc = concentracion[q];
  }

  // Tramos de color en escala logaritmica: los camiones detenidos juntan miles de reportes
  // en un mismo lugar y en escala lineal todo lo demas quedaria azul.
  const nCortes = COLORES.length + 1, cortes = [];
  for (let k = 0; k < nCortes; k++) {
    const c = Math.round(Math.pow(maxConc + 1, k / (nCortes - 1)));
    if (!cortes.includes(c)) cortes.push(c);
  }
  cortes.sort((a, b) => a - b);
  const nColores = Math.max(cortes.length - 1, 1);
  const colores = Array.from({length: nColores}, (_, k) =>
    COLORES[nColores === 1 ? 0 : Math.round(k * (COLORES.length - 1) / (nColores - 1))]);
  const niv = new Uint8Array(n);
  for (let q = 0; q < n; q++) {
    let s = 0;
    while (s < cortes.length && cortes[s] <= concentracion[q]) s++;
    niv[q] = Math.min(Math.max(s - 1, 0), colores.length - 1);
  }

  const totalDias = Math.round((Date.parse(D.hasta) - Date.parse(D.desde)) / 86400000) + 1;
  const dias = Array.from({length: totalDias}, (_, k) => {
    const f = new Date(D.inicioMs + k * 86400000);
    return `${DIAS[(f.getUTCDay() + 6) % 7]} ${dos(f.getUTCDate())}-${dos(f.getUTCMonth() + 1)}-${f.getUTCFullYear()}`;
  });
  const lat = new Float64Array(n), lon = new Float64Array(n), cam = new Int32Array(n);
  const dia = new Int32Array(n), seg = new Int32Array(n);
  for (let q = 0; q < n; q++) {
    const i = u[q];
    lat[q] = D.latE[i] / 1e5; lon[q] = D.lonE[i] / 1e5; cam[q] = D.cam[i];
    dia[q] = Math.floor(D.t[i] / 86400); seg[q] = D.t[i] - dia[q] * 86400;
  }

  const lado = CELDA_M * (2 * RADIO_CELDAS + 1);
  return {
    overlays: {"Puntos GPS": new CapaPuntos({lat, lon, cam, dia, seg, niv, colores, dias, camiones: D.camiones})},
    leyenda: leyendaPasos(colores, cortes, `Reportes GPS en un cuadro de ~${lado} m (rojo = pocos, verde = muchos)`),
    resumen: `${periodo(D)}: ${nf.format(n)} puntos GPS de ${new Set(cam).size} camiones. `
      + `Mayor concentración: ${nf.format(maxConc)} reportes en un cuadro de ~${lado} m.`,
    encuadre: {limites: limitesDatos(lat, lon), opciones: {padding: [30, 30]}},
  };
}

// ---------------------------------------------------------------------------
// Mostrar vistas
// ---------------------------------------------------------------------------
const VISTAS = {calor: vistaCalor, rutas: vistaRutas, uso: vistaUso, puntos: vistaPuntos};

function mejorarControlCamiones(control) {
  const raiz = control.getContainer();
  const lista = raiz.querySelector(".leaflet-control-layers-list");
  const overlays = raiz.querySelector(".leaflet-control-layers-overlays");
  if (!lista || !overlays) return;

  raiz.classList.add("control-camiones");
  const etiquetas = [...overlays.querySelectorAll("label")];
  const camiones = etiquetas.filter(etiqueta => etiqueta.textContent.trim().startsWith("Camión "));
  camiones.forEach(etiqueta => etiqueta.classList.add("capa-camion"));
  etiquetas.filter(etiqueta => !camiones.includes(etiqueta)).forEach(etiqueta => etiqueta.classList.add("capa-general"));

  const herramientas = document.createElement("div");
  herramientas.className = "filtro-camiones";
  herramientas.innerHTML = `
    <div class="filtro-camiones__cabecera">
      <strong>Filtrar camiones</strong>
      <span class="filtro-camiones__contador"></span>
    </div>
    <label class="filtro-camiones__busqueda">
      <span aria-hidden="true">⌕</span>
      <input type="search" placeholder="Buscar patente…" aria-label="Buscar camión por patente" autocomplete="off">
    </label>
    <div class="filtro-camiones__acciones">
      <button type="button" data-accion="mostrar">Mostrar resultados</button>
      <button type="button" data-accion="ocultar">Ocultar resultados</button>
    </div>`;
  const sinResultados = document.createElement("p");
  sinResultados.className = "filtro-camiones__vacio";
  sinResultados.textContent = "No se encontraron camiones.";
  lista.insertBefore(herramientas, overlays);
  lista.insertBefore(sinResultados, overlays);

  const buscador = herramientas.querySelector("input");
  const contador = herramientas.querySelector(".filtro-camiones__contador");
  const botones = [...herramientas.querySelectorAll("button")];
  const normalizar = texto => texto.normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase();

  function resultadosVisibles() {
    const termino = normalizar(buscador.value.trim());
    const visibles = [];
    for (const etiqueta of camiones) {
      const coincide = !termino || normalizar(etiqueta.textContent).includes(termino);
      etiqueta.hidden = !coincide;
      if (coincide) visibles.push(etiqueta);
    }
    contador.textContent = termino ? `${visibles.length} de ${camiones.length}` : `${camiones.length}`;
    sinResultados.classList.toggle("visible", visibles.length === 0);
    botones.forEach(boton => { boton.disabled = visibles.length === 0; });
    return visibles;
  }

  buscador.addEventListener("input", resultadosVisibles);
  buscador.addEventListener("keydown", evento => evento.stopPropagation());
  herramientas.addEventListener("click", evento => {
    const boton = evento.target.closest("button[data-accion]");
    if (!boton) return;
    const activar = boton.dataset.accion === "mostrar";
    for (const etiqueta of resultadosVisibles()) {
      const casilla = etiqueta.querySelector('input[type="checkbox"]');
      if (casilla && casilla.checked !== activar) casilla.click();
    }
  });
  L.DomEvent.disableClickPropagation(herramientas);
  L.DomEvent.disableScrollPropagation(raiz);
  resultadosVisibles();
}

function quitarMostrado() {
  if (!mostrado) return;
  for (const capa of Object.values(mostrado.overlays)) mapa.removeLayer(capa);
  if (mostrado.leyenda) mostrado.leyenda.remove();
  base.ponerControl();
  mostrado = null;
}

async function mostrarVista(nombre) {
  vistaActual = nombre;
  document.getElementById("selector-vista").value = nombre;
  if (!datos) return;
  const miTurno = ++turno, D = datos, tabla = cache;
  quitarMostrado();
  estado("Calculando…");
  // Cada mapa se calcula una sola vez por rango de fechas; si se cambia de pestaña a mitad
  // del calculo, este sigue y queda listo para cuando se vuelva.
  if (!tabla[nombre]) {
    tabla[nombre] = pausa().then(() => VISTAS[nombre](D, texto => { if (turno === miTurno) estado(texto); }));
    tabla[nombre].catch(() => { if (tabla[nombre]) delete tabla[nombre]; });
  }
  let v;
  try {
    v = await tabla[nombre];
  } catch (e) {
    console.error(e);
    if (miTurno === turno) estado(`No se pudo calcular el mapa: ${e.message}`, true);
    return;
  }
  if (miTurno !== turno) return;
  for (const capa of Object.values(v.overlays)) capa.addTo(mapa);
  v.control = base.ponerControl(v.overlays);
  if (nombre === "rutas") mejorarControlCamiones(v.control);
  if (v.leyenda) v.leyenda.addTo(mapa);
  mostrado = v;
  if (v.encuadre && v.encuadre.limites) mapa.fitBounds(v.encuadre.limites, v.encuadre.opciones);
  estado(v.resumen);
}

// ---------------------------------------------------------------------------
// Rango de fechas: de 1 a MAX_DIAS días, ambos incluidos (00:00 a 00:00 hora de Chile).
// ---------------------------------------------------------------------------
const campoDesde = document.getElementById("desde"), campoHasta = document.getElementById("hasta");
const sumarDias = (iso, n) => new Date(Date.parse(iso) + n * 86400000).toISOString().slice(0, 10);
const diasRango = () => Math.round((Date.parse(campoHasta.value) - Date.parse(campoDesde.value)) / 86400000) + 1;

// Por defecto se muestra el día anterior completo; no se pueden elegir días futuros.
const hoyChile = new Intl.DateTimeFormat("en-CA", {timeZone: "America/Santiago"}).format(new Date());
campoDesde.max = campoHasta.max = hoyChile;
campoDesde.value = campoHasta.value = sumarDias(hoyChile, -1);

function actualizarRango() {
  const dias = campoDesde.value && campoHasta.value ? diasRango() : 0;
  document.querySelectorAll("[data-dias]").forEach(b => b.setAttribute("aria-pressed", String(+b.dataset.dias === dias)));
}

// Si una fecha deja el rango al revés o más largo que el máximo, se ajusta la otra.
campoDesde.addEventListener("change", () => {
  if (!campoDesde.value) return;
  if (!campoHasta.value || campoHasta.value < campoDesde.value) campoHasta.value = campoDesde.value;
  if (diasRango() > MAX_DIAS) campoHasta.value = sumarDias(campoDesde.value, MAX_DIAS - 1);
  if (campoHasta.value > hoyChile) campoHasta.value = hoyChile;
  actualizarRango();
});
campoHasta.addEventListener("change", () => {
  if (!campoHasta.value) return;
  if (!campoDesde.value || campoDesde.value > campoHasta.value) campoDesde.value = campoHasta.value;
  if (diasRango() > MAX_DIAS) campoDesde.value = sumarDias(campoHasta.value, -(MAX_DIAS - 1));
  actualizarRango();
});
// Los rangos rápidos terminan en la fecha 'hasta' elegida (por defecto, ayer).
document.querySelectorAll("[data-dias]").forEach(b => b.addEventListener("click", () => {
  if (!campoHasta.value) campoHasta.value = sumarDias(hoyChile, -1);
  campoDesde.value = sumarDias(campoHasta.value, -(+b.dataset.dias - 1));
  actualizarRango();
}));
actualizarRango();

async function cargar() {
  const desde = campoDesde.value, hasta = campoHasta.value;
  if (!desde || !hasta) { estado("Elige las dos fechas.", true); return; }
  const dias = diasRango();
  if (dias < 1) { estado("La fecha 'hasta' tiene que ser igual o posterior a 'desde'.", true); return; }
  if (dias > MAX_DIAS) { estado(`El rango máximo es de ${MAX_DIAS} días.`, true); return; }

  const boton = document.getElementById("cargar");
  boton.disabled = true;
  turno++;
  quitarMostrado();
  datos = null; cache = {};
  // Contador mientras llegan los datos: la consulta puede tardar, que se vea que sigue trabajando
  const inicio = Date.now();
  const avisoCarga = () => estado(`Cargando reportes GPS del ${desde} al ${hasta}… ${Math.round((Date.now() - inicio) / 1000)} s`
    + " (puede tardar un par de minutos; no recargues la página)");
  avisoCarga();
  const reloj = setInterval(avisoCarga, 1000);
  try {
    const gps = await pedir(`/api/gps?desde=${desde}&hasta=${hasta}`);
    clearInterval(reloj);
    if (!gps.t.length) { estado(`No hay reportes GPS entre ${desde} y ${hasta}.`); return; }
    datos = prepararDatos(gps);
    await mostrarVista(vistaActual);
  } catch (e) {
    console.error(e);
    estado(`No se pudieron cargar los datos: ${e.message}`, true);
  } finally {
    clearInterval(reloj);
    boton.disabled = false;
  }
}

document.getElementById("cargar").addEventListener("click", cargar);
document.getElementById("selector-vista").addEventListener("change", evento => mostrarVista(evento.target.value));
</script>
