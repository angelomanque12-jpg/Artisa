name: artisa

x-db-environment: &db-environment
  DB_HOST: mariadb
  DB_NAME: ${MARIADB_DATABASE:?Ejecuta python3 scripts/prepare_env.py}
  DB_USER: ${MARIADB_USER:?Ejecuta python3 scripts/prepare_env.py}
  DB_PASSWORD: ${MARIADB_PASSWORD:?Ejecuta python3 scripts/prepare_env.py}

x-python-health: &python-health
  test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3).read()"]
  interval: 5s
  timeout: 5s
  start_period: 15s
  retries: 12

services:
  # MongoDB y el ETL del JSON histórico son opcionales (perfil "historico"): solo se usan
  # para cargar el archivo histórico. La instalación de la empresa trabaja solo con la API.
  mongodb:
    image: mongo:8.0
    container_name: artisa-mongodb
    profiles: ["historico"]
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      start_period: 20s
      retries: 12
    restart: unless-stopped

  mariadb:
    image: mariadb:11.8
    container_name: artisa-mariadb
    ports:
      - "127.0.0.1:3306:3306"
    environment:
      MARIADB_DATABASE: ${MARIADB_DATABASE:?Ejecuta python3 scripts/prepare_env.py}
      MARIADB_USER: ${MARIADB_USER:?Ejecuta python3 scripts/prepare_env.py}
      MARIADB_PASSWORD: ${MARIADB_PASSWORD:?Ejecuta python3 scripts/prepare_env.py}
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:?Ejecuta python3 scripts/prepare_env.py}
    volumes:
      - mariadb_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      start_period: 30s
      retries: 12
    restart: unless-stopped

  etl:
    build:
      context: .
      dockerfile: ETLs/Dockerfile
    container_name: artisa-etl
    profiles: ["historico"]
    environment:
      <<: *db-environment
      MONGO_URI: ${MONGO_URI:-mongodb://mongodb:27017}
      MONGO_DATABASE: ${MONGO_DATABASE:-gps_data}
      MONGO_COLLECTION: ${MONGO_COLLECTION:-raw_gps}
      MONGO_TIMEOUT_SECONDS: ${MONGO_TIMEOUT_SECONDS:-10}
      TELEMETRY_BATCH_SIZE: ${TELEMETRY_BATCH_SIZE:-2000}
      TELEMETRY_INTERVAL_SECONDS: ${TELEMETRY_INTERVAL_SECONDS:-30}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      mongodb:
        condition: service_healthy
      mariadb:
        condition: service_healthy
    healthcheck: *python-health
    restart: unless-stopped
    init: true

  # Telemetría actual: consulta la API de la empresa (requiere estar en su red/Wi-Fi).
  # Sin COMPANY_API_URL queda en espera y la web sigue mostrando "pendiente".
  # Ante cortes reintenta solo y retoma desde el último reporte guardado.
  telemetria:
    build:
      context: .
      dockerfile: telemetria_api/Dockerfile
    container_name: artisa-telemetria
    environment:
      <<: *db-environment
      COMPANY_API_URL: ${COMPANY_API_URL:-}
      COMPANY_API_TOKEN: ${COMPANY_API_TOKEN:-}
      COMPANY_API_AUTH_HEADER: ${COMPANY_API_AUTH_HEADER:-Authorization}
      COMPANY_API_TABLE: ${COMPANY_API_TABLE:-reportes}
      COMPANY_API_TIMEZONE: ${COMPANY_API_TIMEZONE:-auto}
      COMPANY_API_NATIVE_DATES: ${COMPANY_API_NATIVE_DATES:-1}
      COMPANY_API_INTERVAL_SECONDS: ${COMPANY_API_INTERVAL_SECONDS:-30}
      COMPANY_API_TIMEOUT_SECONDS: ${COMPANY_API_TIMEOUT_SECONDS:-30}
      COMPANY_API_BATCH_SIZE: ${COMPANY_API_BATCH_SIZE:-2000}
      COMPANY_API_OVERLAP_SECONDS: ${COMPANY_API_OVERLAP_SECONDS:-300}
      COMPANY_API_INITIAL_LOOKBACK_HOURS: ${COMPANY_API_INITIAL_LOOKBACK_HOURS:-24}
      COMPANY_API_START: ${COMPANY_API_START:-}
      COMPANY_API_DIALECT: ${COMPANY_API_DIALECT:-postgres}
      COMPANY_API_CURSOR: ${COMPANY_API_CURSOR:-ctid}
      COMPANY_API_WINDOW_PAGES: ${COMPANY_API_WINDOW_PAGES:-500}
      ARTISA_TIMEZONE: ${ARTISA_TIMEZONE:-America/Santiago}
      COMPANY_API_RETRY_MIN_SECONDS: ${COMPANY_API_RETRY_MIN_SECONDS:-5}
      COMPANY_API_RETRY_MAX_SECONDS: ${COMPANY_API_RETRY_MAX_SECONDS:-60}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      mariadb:
        condition: service_healthy
    healthcheck: *python-health
    restart: unless-stopped
    init: true

  # Cierre diario (parte de Machine): resume cada día de 00:00 a 00:00 hora Chile con
  # las reglas del cuaderno de telemetría, sobre los datos en vivo y el histórico.
  machine-diario:
    build:
      context: .
      dockerfile: machine_learning/Dockerfile
    container_name: artisa-machine-diario
    command: ["python", "-m", "machine_learning.diario_worker"]
    environment:
      <<: *db-environment
      ARTISA_TIMEZONE: ${ARTISA_TIMEZONE:-America/Santiago}
      DIARIO_GRACIA_MINUTOS: ${DIARIO_GRACIA_MINUTOS:-15}
      DIARIO_REVISAR_DIAS: ${DIARIO_REVISAR_DIAS:-7}
      DIARIO_DESDE: ${DIARIO_DESDE:-}
      DIARIO_HORA: ${DIARIO_HORA-00:30}
      DIARIO_HOY_CADA_MINUTOS: ${DIARIO_HOY_CADA_MINUTOS:-10}
      # Rutas aprendidas: se reaprenden con cada RUTAS_CADA_DIAS días cerrados nuevos (1 = cada día),
      # con los últimos RUTAS_VENTANA_DIAS días, y valen como previsión de los próximos
      # RUTAS_HORIZONTE_DIAS días. Hasta RUTAS_MAX_CAMIONES_MINIMA camiones = ruta mínima (N5).
      RUTAS_VENTANA_DIAS: ${RUTAS_VENTANA_DIAS:-90}
      RUTAS_CADA_DIAS: ${RUTAS_CADA_DIAS:-1}
      RUTAS_HORIZONTE_DIAS: ${RUTAS_HORIZONTE_DIAS:-7}
      RUTAS_MAX_CAMIONES_MINIMA: ${RUTAS_MAX_CAMIONES_MINIMA:-2}
      # Alertas (Parte 8 del modelo): en N5 o N6 al menos estos reportes, minutos y km de
      # distancia de una ruta N1–N4. Machine las guarda cada minuto en alertas_ruta.
      VIGILANCIA_REPORTES: ${VIGILANCIA_REPORTES:-3}
      VIGILANCIA_MIN_MINUTOS: ${VIGILANCIA_MIN_MINUTOS:-10}
      VIGILANCIA_MIN_KM: ${VIGILANCIA_MIN_KM:-2}
    depends_on:
      mariadb:
        condition: service_healthy
    healthcheck: *python-health
    restart: unless-stopped
    init: true

  endpoints:
    build:
      context: .
      dockerfile: endpoints/Dockerfile
    container_name: artisa-endpoints
    environment:
      <<: *db-environment
      TELEMETRY_INTERVAL_SECONDS: ${TELEMETRY_INTERVAL_SECONDS:-30}
      COMPANY_API_INTERVAL_SECONDS: ${COMPANY_API_INTERVAL_SECONDS:-30}
      ARTISA_TIMEZONE: ${ARTISA_TIMEZONE:-America/Santiago}
      ETL_HISTORICO: ${ETL_HISTORICO:-1}
      RUTAS_CADA_DIAS: ${RUTAS_CADA_DIAS:-1}
      RUTAS_HORIZONTE_DIAS: ${RUTAS_HORIZONTE_DIAS:-7}
      # Solo para mostrar la regla de las alertas en la web (las detecta machine-diario).
      VIGILANCIA_MIN_MINUTOS: ${VIGILANCIA_MIN_MINUTOS:-10}
      VIGILANCIA_MIN_KM: ${VIGILANCIA_MIN_KM:-2}
      # Asistente (Gemini). La clave va solo en .env (GEMINI_API_KEY); sin clave, el chat avisa
      # que no está configurado y el resto de la web sigue igual.
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-}
    depends_on:
      mariadb:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/', timeout=3).read()"]
      interval: 5s
      timeout: 5s
      start_period: 15s
      retries: 12
    restart: unless-stopped
    init: true

  front:
    build:
      context: .
      dockerfile: front/Dockerfile
    container_name: artisa-front
    environment:
      API_URL: http://endpoints:8000
    depends_on:
      endpoints:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/front-health', timeout=3).read()"]
      interval: 5s
      timeout: 5s
      start_period: 15s
      retries: 12
    restart: unless-stopped
    init: true

  # Nginx es la entrada web en localhost:8080: /auth/* va a auth y el resto a front.
  auth:
    build:
      context: .
      dockerfile: auth/Dockerfile
    container_name: artisa-auth
    environment:
      JWT_SECRET: ${JWT_SECRET:?Ejecuta python3 scripts/prepare_env.py}
      AUTH_USERNAME: ${AUTH_USERNAME:?Ejecuta python3 scripts/prepare_env.py}
      AUTH_PASSWORD_HASH: ${AUTH_PASSWORD_HASH:?Ejecuta python3 scripts/prepare_env.py}
      JWT_TTL_SECONDS: ${JWT_TTL_SECONDS:-43200}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health', timeout=3).read()"]
      interval: 5s
      timeout: 5s
      start_period: 5s
      retries: 12
    restart: unless-stopped
    init: true

  nginx:
    build:
      context: .
      dockerfile: nginx/Dockerfile
    container_name: artisa-nginx
    # ARTISA_BIND=0.0.0.0 permite entrar desde otros equipos de la red (servidor de la
    # empresa). Por defecto solo desde este equipo.
    ports:
      - "${ARTISA_BIND:-127.0.0.1}:${ARTISA_PORT:-8080}:8080"
    depends_on:
      auth:
        condition: service_healthy
      front:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:8080/auth/health"]
      interval: 5s
      timeout: 5s
      start_period: 5s
      retries: 12
    restart: unless-stopped
    init: true

  # Respaldo diario de MariaDB en la carpeta respaldos/ (scripts/respaldo.sh).
  respaldo:
    image: mariadb:11.8
    container_name: artisa-respaldo
    entrypoint: ["bash", "/scripts/respaldo.sh"]
    environment:
      TZ: ${ARTISA_TIMEZONE:-America/Santiago}
      MARIADB_DATABASE: ${MARIADB_DATABASE:?Ejecuta python3 scripts/prepare_env.py}
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:?Ejecuta python3 scripts/prepare_env.py}
      RESPALDO_HORA: ${RESPALDO_HORA:-03:00}
      RESPALDO_DIAS: ${RESPALDO_DIAS:-3}
    volumes:
      - ./scripts/respaldo.sh:/scripts/respaldo.sh:ro
      - ./respaldos:/respaldos
    depends_on:
      mariadb:
        condition: service_healthy
    restart: unless-stopped
    init: true

volumes:
  mariadb_data:
  mongodb_data:
