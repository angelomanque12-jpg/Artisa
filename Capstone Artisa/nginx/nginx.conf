events {}

http {
  proxy_http_version 1.1;
  limit_req_zone $binary_remote_addr zone=login_limit:10m rate=10r/m;
  limit_req_zone $binary_remote_addr zone=chat_limit:10m rate=6r/m;
  upstream auth_backend { server auth:8001; }
  upstream front_backend { server front:8000; }

  server {
    listen 8080;

    location = /_auth {
      internal;
      proxy_pass http://auth_backend/verify;
      proxy_pass_request_body off;
      proxy_set_header Content-Length "";
      proxy_set_header Authorization $http_authorization;
    }

    location = /auth/login {
      limit_req zone=login_limit burst=5 nodelay;
      limit_req_status 429;
      proxy_pass http://auth_backend/login;
      proxy_set_header Content-Type $http_content_type;
      proxy_set_header Content-Length $http_content_length;
    }

    location = /auth/health {
      access_log off;
      proxy_pass http://auth_backend/health;
    }

    # Asistente: misma sesión JWT que el resto de /api/ y un límite de frecuencia propio.
    location = /api/chat {
      auth_request /_auth;
      limit_req zone=chat_limit burst=3 nodelay;
      limit_req_status 429;
      client_max_body_size 4k;
      proxy_pass http://front_backend;
      proxy_set_header Authorization $http_authorization;
      proxy_read_timeout 150s;
    }

    location ^~ /api/ {
      auth_request /_auth;
      proxy_pass http://front_backend;
      proxy_set_header Authorization $http_authorization;
      proxy_read_timeout 150s;
    }

    location / {
      proxy_pass http://front_backend;
    }
  }
}
